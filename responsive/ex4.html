<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4.1: @media </title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #eee;
        }

        .content span {
            padding: 15px 25px;
            border-radius: 6px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }

        
        .small { display: none; background: #ff5a36; }
        .big   { display: inline-block; background: #5aa51e; }

        @media screen and (max-width: 600px) {
            .big   { display: none; }
            .small { display: inline-block; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="content">
            <span class="small">I'm SMALL &#128522;</span>
            <span class="big">I'm BIG &#128558;</span>
        </div>
    </div>

</body>
</html>
