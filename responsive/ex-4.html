<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4.2: clamp()</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ddd;
        }

        .content {
            width: clamp(300px, 100%, 800px);
            height: 300px;
            background: #d4f000;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="content"></div>
    </div>

</body>
</html>
