<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .subtitle {
      margin: 0 0 22px;
      font-size: 12px;
      color: #9a9a9a;
    }
  </style>
</head>
<body>

  <div class="card">

    <span class="menu">&#8942;</span>

    <div class="avatar">
      <img src="profile.jpg" alt="Profile picture" class="profile-pic">
      <span class="online"></span>
    </div>

    <h2 style="font-size: 17px;">CHOI SEUNGCHEOL</h2>
    <p class="subtitle">@S.COUPS</p>

    <!-- Stats -->
    <div class="stats">
      <div><span>Posts</span><strong>169</strong></div>
      <div><span>Following</span><strong>15</strong></div>
      <div><span>Followers</span><strong>9.3M</strong></div>
    </div>

    <!-- Paragraph for the short bio -->
    <p class="bio">SEVENTEEN, CARAT Leader</p>

    <!-- Social icons -->
    <div class="social">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Weverse_logo.svg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="Weverse">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIGwPo-he6o2qntz8LfJchyc9Okm151ZYbIqZl2hoObQbx0yhbgMDGwAg&s=10" alt="Facebook">
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Instagram_logo_2022.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Instagram">
    </div>

    <!-- Button for interaction -->
    <button class="btn">View Profile</button>

  </div>

</body>
</html>
