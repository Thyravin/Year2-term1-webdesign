<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }
      body {
  font-family: "Sono", sans-serif;
  margin: 0;
  padding: 40px 20px;
  background: #f4f6fa;
}


.pricing-container {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: stretch;
  gap: 30px;
  max-width: 1000px;
  margin: 0 auto;
}


.pricing-plan {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  padding: 0 0 30px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
  overflow: hidden;
}

.plan-title {
  align-self: stretch;
  text-align: center;
  padding: 22px 0;
  font-size: 20px;
  font-weight: 400;
  color: #fff;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.plan-price {
  padding: 30px 0 20px;
  font-size: 22px;
  font-weight: 700;
  color: #333;
}

.plan-features {
  align-self: stretch;
  list-style: none;
  margin: 0 24px 30px;
  padding: 0;
  display: flex;
  flex-direction: column;
  font-size: 14px;
  color: #666;
}
.plan-features li {
  padding: 12px 0;
  border-bottom: 1px solid #e5e5e5;
}


.plan-button {
  margin-top: auto;
  padding: 12px 44px;
  border: none;
  border-radius: 30px;
  color: #fff;
  font-family: inherit;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
}


.pricing-plan:nth-child(1) .plan-title,
.pricing-plan:nth-child(1) .plan-button {
  background: linear-gradient(90deg, #14c9c0, #1ad6a5);
}
.pricing-plan:nth-child(2) .plan-title,
.pricing-plan:nth-child(2) .plan-button {
  background: linear-gradient(90deg, #1aa7ec, #5b5de8);
}
.pricing-plan:nth-child(3) .plan-title,
.pricing-plan:nth-child(3) .plan-button {
  background: linear-gradient(90deg, #8a3fd8, #e0359f);
}
     
      @media (max-width: 1250px) {
        .pricing-container {
    flex-direction: column;
    align-items: center;
  }
  .pricing-plan {
    flex: none;
    width: 100%;
    max-width: 360px;
  }

      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
