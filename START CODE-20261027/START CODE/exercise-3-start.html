<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     body { color: white; font-family: sans-serif; }

  .box {
    display: flex;
    flex-direction: column;  
    gap: 1rem;
    height: 100vh;
    padding: 1rem;
  }

  header, footer, main, aside, .item {
    border-radius: 0.5rem;
  }

  header {
    background: #1e90ff;
    box-shadow: 0 4px #0077ea;
    height: 60px;             
    padding: 1rem;
  }

  footer {
    background: #4169e1;
    box-shadow: 0 4px #1d44b8;
    height: 60px;             
    padding: 1rem;
  }

  .middle {
    display: flex;            
    gap: 1rem;
    flex: 1;                  
  }

  main {
    background: #3cb371;
    box-shadow: 0 4px #2f8d59;
    flex: 1;                  
    display: flex;
    flex-wrap: wrap;          
    align-content: flex-start;
    gap: 1rem;
    padding: 1rem;
  }

  aside {
    background: #ff6347;
    box-shadow: 0 4px #e02200;
    width: 120px;            
    padding: 1rem;
  }

  .item {
    background: #2f8d59;
    box-shadow: 0 4px #226741;
    width: 80px;
    height: 50px;
    padding: 0.5rem;
  }
  p {
  width: 100%;       
  }
    </style>
</head>
<body>
    <div class="box">
       <header>Header</header>
       <div class="middle">
        <main>
        <p>main</p>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div> 
        </main>
        <aside>sidebar</aside>
        </div>
       <footer>Footer</footer>
    </div>
</body>
</html>
